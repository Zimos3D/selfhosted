version: '3.8'

services:

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - "${DATA_PATH}/zstack_ollama_data:/root/.ollama"
    networks:
      - web

  openwebui:
    image: ghcr.io/open-webui/open-webui:ollama
    restart: unless-stopped
    environment:
      - OLLAMA_API_BASE_URL=http://ollama:11434
      - OPENAI_API_KEY=none
      - HOST=0.0.0.0
      - PORT=8080
    volumes:
      - "${DATA_PATH}/zstack_openwebui_data:/app/backend/data"
    networks:
      - web
    depends_on:
      - ollama
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openwebui.rule=Host(`zgpt.zimos3d.com`)"
      - "traefik.http.routers.openwebui.entrypoints=websecure"
      - "traefik.http.routers.openwebui.tls=true"
      - "traefik.http.routers.openwebui.tls.certresolver=myresolver"


  postgres:
    image: postgres:15
    restart: unless-stopped
    command: postgres -c max_connections=200
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n_user
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}
    volumes:
      # NOTE: Bind mounts with Postgres can have permission issues
      # If you get permission errors, run:
      # sudo chown 999:999 /mnt/nvme-linux/srv/docker/container-data/zstack_n8n_postgres_data
      - "${DATA_PATH}/zstack_n8n_postgres_data:/var/lib/postgresql/data"
    networks:
      - web

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    container_name: n8n
    ports:
      - "5678:5678"
      - "5679:5679"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n_user
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD}
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - WEBHOOK_TUNNEL_URL=https://n8n.zimos3d.com
      - WEBHOOK_URL=https://n8n.zimos3d.com
      - N8N_WEBHOOK_URL=https://n8n.zimos3d.com
      - N8N_HOST=localhost
      - N8N_PROTOCOL=http
      - N8N_PORT=5678
      - NODES_EXCLUDE="[]"
      - N8N_LICENSE_ACTIVATION_KEY=${N8N_LICENSE_ACTIVATION_KEY}
      - N8N_RESTRICT_FILE_ACCESS_TO=""
      - N8N_SSRF_ALLOWED_HOSTNAMES=host.docker.internal,*.zimos3d.com,whisper
      - NO_PROXY=localhost,127.0.0.1,host.docker.internal,whisper
      - N8N_SSRF_ALLOW_INTERNAL_IPS=true
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - N8N_RUNNERS_ENABLED=true
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_AUTH_TOKEN=fartbucket
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
    volumes:
      - "${DATA_PATH}/zstack_n8n_data:/home/node/.n8n"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.zimos3d.com`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls.certresolver=myresolver"
    depends_on:
      - postgres
    networks:
      - web
      - backend

  n8n-runner:
      image: ghcr.io/zimos3d/n8n-runner-custom:latest
      restart: unless-stopped
      environment:
        - N8N_RUNNERS_AUTH_TOKEN=fartbucket
        - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679  
      volumes:
        # Must match n8n volume path for shared workflows
        - "${DATA_PATH}/zstack_n8n_data:/home/node/.n8n"
      networks:
        - backend
      depends_on:
        - n8n


  whisper:
    container_name: whisper-asr
    image: onerahmet/openai-whisper-asr-webservice:latest-gpu
    restart: unless-stopped
    runtime: nvidia
    ports:
      - "9001:9000"
    environment:
      - ASR_ENGINE=whisperx
      - ASR_MODEL=small.en
      - ASR_DEVICE=cuda
      - ASR_QUANTIZATION=int8
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - HOST=0.0.0.0
      - PORT=9000
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - "${DATA_PATH}/zstack_whisper_models:/root/.cache/whisper"
    networks:
      - web

    
networks:
  web:
    external: true
  backend:
    name: backend
    driver: bridge